# Playbook: compromised user credentials / session token (phishing, AiTM, token replay)
name: credential_compromise
description: Evict the attacker from the identity, remove persistence, and stop the campaign spreading.
mitre: [T1566.002, T1078.004, T1550.004, T1114.003, T1098.003]
notify:
  - role: user
  - role: manager
  - role: asset_owner
actions:
  - tool: iam
    operation: revoke_sessions_and_reset_password
    params: {user: "{user}"}
    rationale: Invalidate the replayed session token and any cached credentials.
    reversible: false
  - tool: iam
    operation: enforce_mfa_reregistration
    params: {user: "{user}"}
    rationale: Attacker may have registered their own MFA method; force re-enrolment.
    reversible: true
  - tool: iam
    operation: remove_mailbox_rules
    params: {user: "{user}"}
    when: signals.mailbox_rule_created
    rationale: Delete attacker-created forwarding/deletion rules (persistence + exfil).
    reversible: true
  - tool: iam
    operation: revoke_oauth_grant
    params: {user: "{user}", app_id: "{each:oauth_app_ids}"}
    rationale: Consented OAuth app gives the attacker mailbox access that survives a password reset.
    reversible: true
  - tool: firewall
    operation: block_ip
    params: {ip: "{each:malicious_ips}"}
    rationale: Block attacker infrastructure at the perimeter.
    reversible: true
  - tool: email_gateway
    operation: quarantine_message
    params: {message_id: "{each:campaign_message_ids}"}
    rationale: Pull the same phishing message from every other mailbox before it is opened.
    reversible: true
  - tool: edr
    operation: scan_host
    params: {host: "{host}"}
    when: host
    rationale: Confirm no malware was dropped on the user's workstation.
    reversible: true
