[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-autopilot"
version = "0.1.0"
description = "Autonomous multi-agent system that owns SOC alert triage, investigation, containment and reporting with policy-gated human approval."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Abdulrahman (Dusty)"}]
keywords = ["security", "soc", "incident-response", "agents", "llm", "anthropic", "automation"]
dependencies = [
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "anthropic>=0.40"]

[project.scripts]
socpilot = "socpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
